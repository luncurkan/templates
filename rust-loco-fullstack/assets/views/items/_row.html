<tr id="item-{{ item.id }}">
    <td>{{ item.name }}</td>
    <td>{{ item.description | default(value="-") }}</td>
    <td>{{ item.created_at | date(format="%Y-%m-%d %H:%M") }}</td>
    <td class="actions">
        <button
            class="btn-secondary"
            hx-get="/{{ item.id }}/edit"
            hx-target="#item-{{ item.id }}"
            hx-swap="outerHTML">
            Edit
        </button>
        <button
            class="btn-danger"
            hx-delete="/{{ item.id }}"
            hx-target="#item-{{ item.id }}"
            hx-swap="outerHTML swap:0.3s"
            hx-confirm="Are you sure you want to delete this item?">
            Delete
        </button>
    </td>
</tr>
