logger:
  enable: true
  pretty_backtrace: false
  level: info
  format: json

server:
  host: http://localhost
  binding: 0.0.0.0
  port: {{get_env(name="PORT", default="3000")}}

database:
  uri: {{get_env(name="DATABASE_URL", default="postgres://postgres:postgres@db:5432/app")}}
  enable_logging: false
  connect_timeout: 500
  idle_timeout: 500
  min_connections: 1
  max_connections: 10
  auto_migrate: true
